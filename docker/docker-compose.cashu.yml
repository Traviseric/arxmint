# ============================================================
# ArxMint — Lightweight Cashu-Only Stack
# For quick setup without full Fedimint federation
# Usage: docker compose -f docker/docker-compose.cashu.yml up -d
# ============================================================

services:

  lnd:
    image: lightninglabs/lnd:v0.18.0-beta
    container_name: sf-lnd-lite
    restart: unless-stopped
    command: >
      lnd
      --bitcoin.active
      --bitcoin.testnet
      --bitcoin.node=neutrino
      --neutrino.addpeer=faucet.lightning.community
      --rpclisten=0.0.0.0:10009
      --restlisten=0.0.0.0:8080
      --tlsextradomain=lnd
      --accept-keysend
      --db.backend=sqlite
      # NOTE: Run 'docker exec sf-lnd-lite lncli create' after first start to create wallet + save seed phrase
    ports:
      - "9735:9735"
      - "10009:10009"
      - "8080:8080"
    volumes:
      - lnd-data:/root/.lnd
    networks:
      - sovereign

  cashu-mint:
    image: cashubtc/nutshell:latest
    container_name: sf-cashu-lite
    restart: unless-stopped
    environment:
      - MINT_BACKEND_BOLT11_SAT=LndRestWallet
      - MINT_LND_REST_ENDPOINT=https://lnd:8080
      - MINT_LND_REST_CERT=/root/.lnd/tls.cert
      - MINT_LND_REST_MACAROON=/root/.lnd/data/chain/bitcoin/testnet/admin.macaroon
      - MINT_LISTEN_HOST=0.0.0.0
      - MINT_LISTEN_PORT=3338
      - MINT_PRIVATE_KEY=${CASHU_PRIVATE_KEY:?Set CASHU_PRIVATE_KEY in .env}
    ports:
      - "3338:3338"
    volumes:
      - lnd-data:/root/.lnd:ro
      - cashu-data:/app/data
    depends_on:
      - lnd
    networks:
      - sovereign

  # ── Backup watcher (optional — uncomment to enable) ──────────────────────────
  # Watches LND channel.backup for changes and runs a full backup on each change.
  # Also runs a daily backup at 02:00 UTC.
  # Enable with: docker compose -f docker/docker-compose.cashu.yml --profile backup up -d
  #
  # backup-watcher:
  #   image: node:22-alpine
  #   container_name: sf-backup-watcher
  #   profiles: [backup]
  #   restart: unless-stopped
  #   working_dir: /app
  #   command: node --experimental-strip-types dist/backup-watcher.js
  #   environment:
  #     - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
  #     - BITCOIN_NETWORK=${BITCOIN_NETWORK:-testnet}
  #     - LND_DATA_DIR=/root/.lnd
  #     - BACKUP_DIR=/backup
  #   volumes:
  #     - lnd-data:/root/.lnd:ro
  #     - ./backup:/backup
  #     - .:/app:ro
  #   networks:
  #     - sovereign

volumes:
  lnd-data:
  cashu-data:

networks:
  sovereign:
    driver: bridge
