apiVersion: 1

groups:
  - orgId: 1
    name: arxmint_critical
    folder: ArxMint
    interval: 1m
    rules:
      - uid: lnbits-down
        title: LNbitsDown
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: probe_success{job="lnbits"} == 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "LNbits is unreachable — payments will fail"
          description: "The LNbits instance has not responded to blackbox probe for 2 minutes. Checkout will be broken."

      - uid: webhook-failure-rate
        title: WebhookDeliveryFailureRate
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: rate(arxmint_webhook_failures_total[5m]) > 0.1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Webhook delivery failure rate > 10%"
          description: "More than 10% of webhook deliveries in the last 5 minutes have failed. Check merchant endpoint availability."

      - uid: checkout-sessions-stuck
        title: CheckoutSessionsStuck
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: arxmint_pending_sessions_count > 50
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 50 pending checkout sessions — possible LNbits issue"
          description: "arxmint_pending_sessions_count has been above 50 for 10 minutes. Sessions may be stuck waiting for LNbits confirmation."

      - uid: app-target-down
        title: ArxMintAppDown
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: up{job="arxmint-app"} == 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ArxMint app is unreachable"
          description: "Prometheus cannot scrape /api/metrics — Next.js app may be down."
