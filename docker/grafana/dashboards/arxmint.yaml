# Grafana dashboard provisioning config
# Tells Grafana to load dashboards from this directory
apiVersion: 1

providers:
  - name: "ArxMint"
    orgId: 1
    folder: "ArxMint"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
