# ============================================================
# ArxMint — CDK Production Mint Override
# Use with: docker compose -f docker-compose.yml -f docker/docker-compose.cdk.yml up
#
# Replaces the default Nutshell cashu-mint service with the
# Rust-based CDK mint (cashubtc/cdk-mintd) for production use.
#
# CDK advantages over Nutshell:
#   - Rust-native, lower memory footprint
#   - Multi-backend Lightning support (LND, CLN, Strike, etc.)
#   - Exposes /metrics Prometheus endpoint
#   - Better suited for mainnet / community deployments
#
# Matches the image and env vars generated by lib/community-generator.ts
# when memberCount > 30 or network === "bitcoin".
# ============================================================

services:
  cashu-mint:
    image: cashubtc/cdk-mintd:latest
    container_name: sf-cdk-mint
    restart: unless-stopped
    environment:
      - CDK_MINT_URL=http://0.0.0.0:3338
      - CDK_MINT_LISTEN_HOST=0.0.0.0
      - CDK_MINT_LISTEN_PORT=3338
      - CDK_LN_BACKEND=lnd
      - CDK_LND_ADDRESS=https://lnd:8080
      - CDK_LND_CERT_PATH=/root/.lnd/tls.cert
      - CDK_LND_MACAROON_PATH=/root/.lnd/data/chain/bitcoin/${BITCOIN_NETWORK:-testnet}/admin.macaroon
      - CDK_MINT_INFO_NAME=${MINT_NAME:-ArxMint Community}
      - CDK_MINT_INFO_DESCRIPTION=ArxMint sovereign ecash mint
    ports:
      - "3338:3338"
    volumes:
      - lnd-data:/root/.lnd:ro
      - cdk-mint-data:/data
    depends_on:
      lnd:
        condition: service_healthy
    networks:
      - sovereign

volumes:
  cdk-mint-data:
