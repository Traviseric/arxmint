manifestVersion: 1
id: arxmint
category: bitcoin
name: ArxMint
version: "0.5.0"
tagline: "Sovereign Payment Network — ecash + Lightning for communities"
description: >
  ArxMint turns a natural-language prompt into a full Bitcoin circular economy:
  Cashu ecash mint, Lightning L402 rails, merchant checkout, and privacy defaults.
  One prompt → live sovereign economy. Humans and AI agents share the same
  private commerce infrastructure. Near-zero fees, instant settlement, no KYC,
  no chargebacks.
